<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The History of You.</title>
<style>body{margin:0;background:#07100f;color:#eef7f3;font-family:Inter,system-ui,sans-serif}.boot{padding:2.2rem}</style>
</head>
<body>
<div class="boot" id="boot">Loading The History of You…</div>
<script>
(async function(){
  const n = 13;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const name = "part" + i + ".txt";
    const res = await fetch(name);
    if (!res.ok) throw new Error(name + " " + res.status);
    parts.push(await res.text());
  }
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch(function(err){
  document.getElementById("boot").textContent = "Failed to load the page: " + err;
});
</script>
</body>
</html>
