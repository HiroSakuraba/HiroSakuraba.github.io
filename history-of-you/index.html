<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The History of You.</title>
</head>
<body style="margin:0;background:#07100f;color:#eef7f3;font-family:Inter,system-ui,sans-serif;padding:2rem">
<p>Loading The History of You…</p>
<script>
(async function(){
  const names = ["part0.txt","part1.txt","part2.txt","part3.txt"];
  const parts = [];
  for (const f of names) {
    const r = await fetch(f);
    if (!r.ok) throw new Error(f + " " + r.status);
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch(function(e){
  document.body.textContent = "Failed to load: " + e;
});
</script>
</body>
</html>
